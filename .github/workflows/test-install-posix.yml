name: Test install.sh

on:
  push:
    branches: [develop, main]
    paths:
      - 'install.sh'
      - '.github/workflows/test-install-posix.yml'
      - 'CMakeLists.txt'
      - 'src/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'install.sh'
      - '.github/workflows/test-install-posix.yml'
  workflow_dispatch:
    inputs:
      test_source_build:
        description: 'Force source build test'
        default: 'true'
      test_release_download:
        description: 'Test release binary download'
        default: 'false'

jobs:
  lint:
    name: Lint install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --severity=warning install.sh
      - name: shfmt
        run: |
          wget -qO /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64
          chmod +x /tmp/shfmt
          /tmp/shfmt -d -i 4 -ci install.sh
      - name: POSIX shebang
        run: head -n 1 install.sh | grep -q '^#!/bin/sh$'
      - name: bashisms check
        run: |
          sudo apt-get install -y devscripts
          checkbashisms -p install.sh || true
      - name: typo check
        run: |
          grep -n 'succesfully' install.sh && exit 1 || true
          grep -n 'verion' install.sh && exit 1 || true
          grep -n 'Erorr' install.sh && exit 1 || true

  test-ubuntu-source:
    name: Ubuntu Source Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ git
      - name: Set install directory
        run: |
          INSTALL_DIR="${HOME}/.local/bin"
          mkdir -p "${INSTALL_DIR}"
          echo "SNIFFER_INSTALL_DIR=${INSTALL_DIR}" >> "$GITHUB_ENV"
          echo "SNIFFERCOMMIT_INSTALL_DIR=${INSTALL_DIR}" >> "$GITHUB_ENV"
      - run: sh install.sh --help
      - name: Test --version
        run: sh install.sh --version
      - run: sh install.sh --verbose
        env:
          SNIFFERCOMMIT_FORCE_BUILD: 1
          SNIFFERCOMMIT_BRANCH: ${{ github.ref_name }}
      - run: test -f "${SNIFFER_INSTALL_DIR}/sniffercommit"
      - run: '"${SNIFFER_INSTALL_DIR}/sniffercommit" --version'
      - run: |
          mkdir -p /tmp/test-project && cd /tmp/test-project
          git init
          "${SNIFFER_INSTALL_DIR}/sniffercommit" init --style google --enable-clang-tidy
          test -f .sniffercommit.toml
          test -f .clang-format
          test -f .clang-tidy
      - run: |
          cd /tmp/test-project
          "${SNIFFER_INSTALL_DIR}/sniffercommit" run --dry-run --all-files
      - run: sh install.sh --force-build --verbose
        env:
          SNIFFERCOMMIT_FORCE_BUILD: 1
          SNIFFERCOMMIT_BRANCH: ${{ github.ref_name }}
      - run: sh install.sh --uninstall
      - run: test ! -f "${SNIFFER_INSTALL_DIR}/sniffercommit"

  test-macos-source:
    name: macOS Source Build
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake ninja
      - run: sh install.sh --verbose
        env:
          SNIFFERCOMMIT_FORCE_BUILD: 1
          SNIFFERCOMMIT_BRANCH: ${{ github.ref_name }}
      - name: Find install dir
        run: |
          if [ -n "${CARGO_HOME:-}" ]; then
            echo "SNIFFER_INSTALL_DIR=${CARGO_HOME}/bin" >> "$GITHUB_ENV"
          elif [ -d "$HOME/.cargo/bin" ]; then
            echo "SNIFFER_INSTALL_DIR=$HOME/.cargo/bin" >> "$GITHUB_ENV"
          else
            echo "SNIFFER_INSTALL_DIR=$HOME/.local/bin" >> "$GITHUB_ENV"
          fi
      - run: test -f "${SNIFFER_INSTALL_DIR}/sniffercommit"
      - run: '"${SNIFFER_INSTALL_DIR}/sniffercommit" --version'
      - run: |
          mkdir -p /tmp/test-project && cd /tmp/test-project
          git init
          "${SNIFFER_INSTALL_DIR}/sniffercommit" init --style llvm --enable-clang-tidy
          test -f .sniffercommit.toml
      - run: sh install.sh --uninstall
      - run: test ! -f "${SNIFFER_INSTALL_DIR}/sniffercommit"

  test-shells:
    name: Test with Different Shells
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        shell: [bash, dash, zsh]
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ git
          if [ "${{ matrix.shell }}" = "zsh" ]; then sudo apt-get install -y zsh; fi
      - run: ${{ matrix.shell }} install.sh --verbose
        env:
          SNIFFERCOMMIT_FORCE_BUILD: 1
          SNIFFERCOMMIT_BRANCH: ${{ github.ref_name }}
      - name: Find install dir
        run: |
          if [ -n "${CARGO_HOME:-}" ]; then
            echo "SNIFFER_INSTALL_DIR=${CARGO_HOME}/bin" >> "$GITHUB_ENV"
          elif [ -d "$HOME/.cargo/bin" ]; then
            echo "SNIFFER_INSTALL_DIR=$HOME/.cargo/bin" >> "$GITHUB_ENV"
          else
            echo "SNIFFER_INSTALL_DIR=$HOME/.local/bin" >> "$GITHUB_ENV"
          fi
      - run: test -f "${SNIFFER_INSTALL_DIR}/sniffercommit"
      - run: rm -f "${SNIFFER_INSTALL_DIR}/sniffercommit"

  test-no-modify-path:
    name: Test --no-modify-path
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ git
      - run: sh install.sh --no-modify-path --verbose
        env:
          SNIFFERCOMMIT_FORCE_BUILD: 1
          SNIFFERCOMMIT_BRANCH: ${{ github.ref_name }}
      - run: |
          if grep -q "sniffercommit" "$HOME/.bashrc" 2>/dev/null; then
            echo "PATH was modified despite --no-modify-path" && exit 1
          fi
      - name: Find install dir
        run: |
          if [ -n "${CARGO_HOME:-}" ]; then
            echo "SNIFFER_INSTALL_DIR=${CARGO_HOME}/bin" >> "$GITHUB_ENV"
          elif [ -d "$HOME/.cargo/bin" ]; then
            echo "SNIFFER_INSTALL_DIR=$HOME/.cargo/bin" >> "$GITHUB_ENV"
          else
            echo "SNIFFER_INSTALL_DIR=$HOME/.local/bin" >> "$GITHUB_ENV"
          fi
      - run: test -f "${SNIFFER_INSTALL_DIR}/sniffercommit"
      - run: rm -f "${SNIFFER_INSTALL_DIR}/sniffercommit"

  test-release-download:
    name: Test Release Binary Download
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ github.event.inputs.test_release_download == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - run: 'sh install.sh --verbose; code=$?; echo "exit code: $code"'
      - name: Find install dir
        run: |
          if [ -n "${CARGO_HOME:-}" ]; then
            echo "SNIFFER_INSTALL_DIR=${CARGO_HOME}/bin" >> "$GITHUB_ENV"
          elif [ -d "$HOME/.cargo/bin" ]; then
            echo "SNIFFER_INSTALL_DIR=$HOME/.cargo/bin" >> "$GITHUB_ENV"
          else
            echo "SNIFFER_INSTALL_DIR=$HOME/.local/bin" >> "$GITHUB_ENV"
          fi
      - run: |
          if [ -f "${SNIFFER_INSTALL_DIR}/sniffercommit" ]; then
            "${SNIFFER_INSTALL_DIR}/sniffercommit" --version
          else
            echo "No release binary (expected if none published)"
          fi

  test-cargo-home:
    name: Test CARGO_HOME Install Dir
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ git
      - run: sh install.sh --verbose
        env:
          CARGO_HOME: /tmp/cargo-test
          SNIFFERCOMMIT_FORCE_BUILD: 1
          SNIFFERCOMMIT_BRANCH: ${{ github.ref_name }}
      - run: test -f "/tmp/cargo-test/bin/sniffercommit"
      - run: '"/tmp/cargo-test/bin/sniffercommit" --version'
      - run: rm -rf /tmp/cargo-test
