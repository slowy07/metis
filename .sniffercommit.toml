# sniffercommit configuration - TOML format
# Generated by sniffercommit init

[project]
name = "my-project"

[[checks]]
name = "clang-format"
command = "clang-format"
args = ["-i", "-style=file"]
patterns = ["*.cpp", "*.h", "*.hpp"]

[[checks]]
name = "trailing-whitespace"
command = "grep"
args = ["-Pl", "[[:space:]]+$"]
patterns = ["*"]

[exclude]
paths = ["third_party/", "build/", ".git/"]

[output]
local_hook = true
github_actions = true
